<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f2f3ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="domate">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="robots" content="noindex">
<title>domate | やりたいことを、一緒にやる仲間と</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='56' r='38' fill='%23e2574c'/%3E%3Cpath d='M50 22 L40 12 L46 22 L34 20 L46 26 L50 30 L54 26 L66 20 L54 22 L60 12 Z' fill='%235bae5b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2f3ef; --surface: #ffffff; --ink: #1f2420; --soft: #6e746f; --line: #e1e4de;
    --tomato: #e0412f; --tomato-dark: #b9301f; --tomato-light: #fbedea;
    --leaf: #2e5e46; --leaf-light: #e6eee8;
    --pink: #e9b9ae; --pink-light: #f6eeeb;
    --shadow: 0 1px 2px rgba(31, 36, 32, .06);
    --nav-h: 62px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); }
  body { font-family: "Zen Kaku Gothic New", system-ui, sans-serif; color: var(--ink); line-height: 1.75; font-size: 15px; font-feature-settings: "palt"; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: none; background: none; }
  a { color: var(--ink); }
  a.btn, a.chip, .card a, .nav a { text-decoration: none; }
  img { max-width: 100%; display: block; }
  :focus-visible { outline: 2px solid var(--tomato); outline-offset: 2px; }
  .ic { width: 1.15em; height: 1.15em; flex: 0 0 auto; vertical-align: -0.2em; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  .shell { max-width: 540px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(var(--nav-h) + 28px + env(safe-area-inset-bottom)); }

  /* ヘッダー */
  .topbar { position: sticky; top: 0; z-index: 20; background: rgba(242, 243, 239, .94); backdrop-filter: blur(12px); display: flex; align-items: center; gap: 8px; padding: 14px 18px 10px; }
  .topbar h1 { font-size: 1.05rem; font-weight: 700; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 1.45rem; letter-spacing: -0.03em; flex: 1; }
  .brand .dot { width: 13px; height: 13px; border-radius: 50%; background: var(--tomato); box-shadow: 4px -4px 0 -3px var(--leaf); }
  .icon-btn { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 1.15rem; color: var(--ink); }
  .icon-btn:hover { background: var(--line); }

  .demo-banner { margin: 0 18px 4px; font-size: .78rem; color: var(--soft); }

  .content { padding: 6px 14px 0; }

  /* タブ・絞り込み */
  .chips { display: flex; gap: 20px; overflow-x: auto; padding: 0 4px; margin-bottom: 14px; border-bottom: 1px solid var(--line); scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; padding: 8px 0 10px; font-size: .92rem; color: var(--soft); white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 5px; align-items: center; }
  .chip.on { color: var(--ink); font-weight: 700; border-color: var(--ink); }
  .seg { display: flex; gap: 6px; margin-bottom: 16px; padding: 0 2px; }
  .seg button { padding: 5px 14px; border-radius: 999px; font-size: .85rem; color: var(--soft); border: 1px solid var(--line); background: transparent; }
  .seg button.on { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* 汎用カード */
  .card { background: var(--surface); border-radius: 14px; padding: 16px 18px; margin-bottom: 12px; }
  .card.tap { cursor: pointer; }

  /* 投稿 */
  .post { background: var(--surface); border-radius: 14px; margin-bottom: 14px; overflow: hidden; }
  .post.tap { cursor: pointer; }
  .post .pad { padding: 14px 18px 12px; }
  .post .photo-top { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
  .post.full .photo-top { aspect-ratio: auto; max-height: 70vh; }
  .card-head { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: .8rem; flex: 0 0 auto; }
  .avatar.sm { width: 28px; height: 28px; font-size: .75rem; }
  .avatar.lg { width: 64px; height: 64px; font-size: 1.4rem; }
  .who { flex: 1; min-width: 0; line-height: 1.35; display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 8px; }
  .who b { font-size: .88rem; font-weight: 700; }
  .meta { color: var(--soft); font-size: .78rem; display: inline-flex; align-items: center; gap: 4px; }
  .post h3 { font-size: 1.12rem; line-height: 1.5; font-weight: 700; letter-spacing: .01em; }
  .body { white-space: pre-wrap; word-break: break-word; color: #3a403c; margin-top: 4px; }
  .clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .photo { border-radius: 10px; margin-top: 10px; max-height: 360px; width: 100%; object-fit: cover; }

  /* 募集＝チケット */
  .post.rec { display: grid; grid-template-columns: 88px 1fr; position: relative; }
  .stub { background: var(--leaf); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 14px 6px; text-align: center; line-height: 1.15; position: relative; }
  .stub .mo { font-size: .78rem; opacity: .85; }
  .stub .dd { font-size: 2.3rem; font-weight: 700; letter-spacing: -0.03em; margin: 2px 0 4px; }
  .stub .tm { font-size: .78rem; opacity: .9; }
  .stub .st { margin-top: 10px; font-size: .7rem; border: 1px solid rgba(255,255,255,.6); border-radius: 999px; padding: 1px 8px; }
  .post.rec::before, .post.rec::after { content: ""; position: absolute; left: 81px; width: 14px; height: 14px; border-radius: 50%; background: var(--bg); }
  .post.rec::before { top: -7px; } .post.rec::after { bottom: -7px; }
  .post.rec .ticket { border-left: 2px dashed var(--line); padding: 14px 16px 10px 16px; min-width: 0; }
  .post.rec.done .stub { background: #9aa39d; }
  .facts { display: grid; gap: 3px; margin-top: 8px; font-size: .86rem; color: #3a403c; }
  .facts div { display: flex; gap: 6px; align-items: flex-start; }
  .facts .ic { color: var(--soft); margin-top: 3px; }

  .actions { display: flex; gap: 2px; margin-top: 8px; align-items: center; margin-left: -8px; }
  .act { display: inline-flex; align-items: center; gap: 5px; padding: 6px 8px; border-radius: 999px; color: var(--soft); font-size: .85rem; }
  .act:hover { background: var(--bg); }
  .act.liked { color: var(--tomato); }
  .act.liked .ic { fill: currentColor; }
  .spacer { flex: 1; }
  .status-pill { font-size: .76rem; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--soft); white-space: nowrap; }
  .st-pending { border-color: #e2c27a; color: #8a6400; }
  .st-approved { border-color: var(--leaf); color: var(--leaf); }
  .st-rejected { color: var(--soft); }
  .badge { font-size: .74rem; color: var(--soft); white-space: nowrap; }
  .badge.closed { color: var(--soft); }

  /* ボタン・フォーム */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 22px; border-radius: 999px; background: var(--ink); color: #fff; font-weight: 700; white-space: nowrap; text-decoration: none; transition: background .15s; }
  .btn:hover { background: #000; }
  .btn.accent, .btn.green { background: var(--tomato); }
  .btn.accent:hover, .btn.green:hover { background: var(--tomato-dark); }
  .btn:disabled { background: #c9cdc8; cursor: default; }
  .btn.sub { background: transparent; color: var(--ink); border: 1px solid var(--ink); }
  .btn.ghost { background: var(--bg); color: var(--ink); }
  .btn.sm { padding: 6px 14px; font-size: .84rem; }
  .btn.block { width: 100%; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }

  label.f { display: block; font-size: .84rem; font-weight: 700; margin: 16px 0 6px; }
  label.f small { font-weight: 400; color: var(--soft); }
  .input, textarea.input, select.input { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; background: var(--surface); outline: none; }
  .input:focus { border-color: var(--ink); }
  textarea.input { min-height: 110px; resize: vertical; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: .88rem; margin-top: 14px; }
  .check input { margin-top: 5px; accent-color: var(--tomato); width: 18px; height: 18px; flex: 0 0 auto; }
  .kind-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kind-pick button { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--surface); text-align: left; }
  .kind-pick button b { display: block; }
  .kind-pick button.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .kind-pick .k-sub { font-size: .76rem; color: var(--soft); }
  .vis { display: grid; gap: 8px; }
  .vis label { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; background: var(--surface); cursor: pointer; }
  .vis input { accent-color: var(--ink); }
  .preview { position: relative; margin-top: 8px; }
  .preview button { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,.55); color: #fff; width: 30px; height: 30px; border-radius: 50%; }
  .hint { font-size: .78rem; color: var(--soft); margin-top: 6px; }

  .sec-title { font-size: .92rem; font-weight: 700; margin: 24px 4px 10px; display: flex; align-items: baseline; gap: 8px; }

  /* コメント・申請・チャット */
  .cmt { display: flex; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
  .cmt:first-child { border-top: none; padding-top: 0; }
  .cmt .txt { flex: 1; min-width: 0; }
  .cmt .txt b { font-size: .86rem; margin-right: 6px; }
  .mini-link { font-size: .74rem; color: var(--soft); text-decoration: underline; margin-left: 6px; }
  .send-bar { display: flex; gap: 8px; margin-top: 12px; }
  .send-bar .input { border-radius: 999px; }

  .chat { display: flex; flex-direction: column; gap: 10px; padding-bottom: 84px; }
  .bubble-row { display: flex; gap: 8px; align-items: flex-end; }
  .bubble-row.me { flex-direction: row-reverse; }
  .bubble-row > div { max-width: 78%; min-width: 0; }
  .bubble { width: fit-content; padding: 9px 14px; border-radius: 18px; background: var(--surface); white-space: pre-wrap; word-break: break-word; }
  .me .bubble { margin-left: auto; background: var(--ink); color: #fff; }
  .bubble-name { font-size: .72rem; color: var(--soft); margin: 0 0 2px 4px; }
  .chat-bar { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); background: rgba(242,243,239,.96); border-top: 1px solid var(--line); padding: 10px 14px; }
  .chat-bar .inner { max-width: 540px; margin: 0 auto; display: flex; gap: 8px; }

  /* おもいで */
  .album { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 12px; }
  .album .ph { position: relative; aspect-ratio: 1; border-radius: 6px; overflow: hidden; background: var(--bg); }
  .album .ph img { width: 100%; height: 100%; object-fit: cover; }
  .album .ph button { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; font-size: .75rem; }
  .album .add { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; color: var(--soft); border: 1px dashed #b9bfb8; background: transparent; font-size: .74rem; }
  .consent { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; font-size: .8rem; }
  .consent .ok { color: var(--leaf); border: 1px solid var(--leaf); padding: 1px 10px; border-radius: 999px; }
  .consent .ng { color: var(--soft); border: 1px solid var(--line); padding: 1px 10px; border-radius: 999px; }
  .source { display: grid; gap: 2px; padding: 12px 16px; border: 1px solid var(--line); background: transparent; }

  /* 下のナビ */
  .nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .nav .inner { max-width: 540px; margin: 0 auto; display: flex; height: var(--nav-h); align-items: center; }
  .nav a { flex: 1; text-align: center; color: var(--soft); font-size: .66rem; line-height: 1.4; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .nav a .ic { width: 22px; height: 22px; }
  .nav a.on { color: var(--ink); font-weight: 700; }
  .nav .plus { width: 46px; height: 46px; border-radius: 50%; background: var(--tomato); color: #fff; display: grid; place-items: center; }
  .nav .plus .ic { stroke-width: 2.2; }

  /* シート・トースト */
  .overlay { position: fixed; inset: 0; background: rgba(20, 24, 21, .4); z-index: 50; display: flex; align-items: flex-end; justify-content: center; animation: fade .15s; }
  .sheet { background: var(--surface); width: 100%; max-width: 540px; border-radius: 20px 20px 0 0; padding: 22px 20px calc(24px + env(safe-area-inset-bottom)); max-height: 90vh; overflow: auto; animation: up .2s ease-out; }
  .sheet h2 { font-size: 1.08rem; margin-bottom: 6px; }
  .sheet .menu-item { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 14px 4px; border-bottom: 1px solid var(--line); font-size: .95rem; }
  .sheet .menu-item.danger { color: var(--tomato-dark); }
  @keyframes up { from { transform: translateY(30px); opacity: 0; } }
  @keyframes fade { from { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .overlay, .sheet, .toast { animation: none; } }
  .toast { position: fixed; left: 50%; top: 72px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: .86rem; z-index: 60; max-width: 90vw; animation: fade .2s; }

  .empty { text-align: center; color: var(--soft); padding: 48px 20px; }
  .empty .big { width: 44px; height: 44px; margin: 0 auto 12px; border-radius: 50%; background: var(--tomato); opacity: .9; }
  .loading { text-align: center; padding: 48px; color: var(--soft); }

  /* ログイン */
  .auth { padding: 48px 22px; max-width: 460px; margin: 0 auto; }
  .auth .hero { margin-bottom: 28px; }
  .auth .hero h1 { font-size: 2.6rem; letter-spacing: -0.04em; display: flex; align-items: center; gap: 10px; }
  .auth .hero p { color: var(--soft); margin-top: 4px; }
  .rules { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; font-size: .82rem; margin-top: 18px; }
  .rules li { margin-left: 1.2em; }
  .err { color: var(--tomato-dark); font-size: .85rem; margin-top: 10px; }
</style>
</head>
<body>
  <div id="app"><div class="loading">読み込み中…</div></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
