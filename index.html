<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#e2574c">
<meta name="robots" content="noindex">
<title>domate | やりたいことを、一緒にやる仲間と</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='56' r='38' fill='%23e2574c'/%3E%3Cpath d='M50 22 L40 12 L46 22 L34 20 L46 26 L50 30 L54 26 L66 20 L54 22 L60 12 Z' fill='%235bae5b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --tomato: #e2574c; --tomato-dark: #c8443a; --tomato-light: #fdecea;
    --leaf: #5bae5b; --leaf-light: #e8f5e8;
    --pink: #f4a7b9; --pink-light: #fdf0f3;
    --bg: #fffaf7; --card: #fff; --ink: #3f3236; --soft: #8b7c80; --line: #f0e4e6;
    --radius: 20px; --shadow: 0 4px 18px rgba(200, 68, 58, .08);
    --nav-h: 64px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); }
  body { font-family: "Zen Maru Gothic", system-ui, sans-serif; color: var(--ink); line-height: 1.7; font-size: 15px; }
  .en { font-family: "Quicksand", sans-serif; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: none; background: none; }
  a { color: var(--tomato-dark); }
  a.btn, a.chip, .card a { text-decoration: none; }
  img { max-width: 100%; display: block; }

  .shell { max-width: 560px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(var(--nav-h) + 24px + env(safe-area-inset-bottom)); }

  /* ヘッダー */
  .topbar { position: sticky; top: 0; z-index: 20; background: rgba(255, 250, 247, .92); backdrop-filter: blur(10px); display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .topbar h1 { font-size: 1.1rem; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 1.35rem; color: var(--tomato); flex: 1; }
  .icon-btn { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 1.15rem; }
  .icon-btn:hover { background: var(--tomato-light); }

  .demo-banner { background: var(--leaf-light); color: #2f6b2f; font-size: .8rem; padding: 8px 16px; text-align: center; }

  .content { padding: 14px 14px 0; }

  /* チップ・タブ */
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; padding: 6px 14px; border-radius: 999px; background: #fff; border: 1.5px solid var(--line); font-size: .88rem; white-space: nowrap; }
  .chip.on { background: var(--tomato); border-color: var(--tomato); color: #fff; }
  .seg { display: flex; background: #f6eceb; border-radius: 999px; padding: 4px; margin-bottom: 14px; }
  .seg button { flex: 1; padding: 7px 0; border-radius: 999px; font-size: .9rem; color: var(--soft); }
  .seg button.on { background: #fff; color: var(--ink); font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,.08); }

  /* カード */
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
  .card.tap { cursor: pointer; transition: transform .15s; }
  .card.tap:active { transform: scale(.985); }
  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; flex: 0 0 auto; }
  .avatar.sm { width: 30px; height: 30px; font-size: .8rem; }
  .who { flex: 1; min-width: 0; line-height: 1.35; }
  .who b { display: block; font-size: .95rem; }
  .meta { color: var(--soft); font-size: .78rem; }
  .badge { font-size: .72rem; padding: 3px 10px; border-radius: 999px; font-weight: 700; white-space: nowrap; }
  .badge.exp { background: var(--pink-light); color: #c24d6b; }
  .badge.rec { background: var(--leaf-light); color: #2f7d2f; }
  .badge.closed { background: #eee; color: #888; }
  .card h3 { font-size: 1.08rem; line-height: 1.5; margin-bottom: 4px; }
  .body { white-space: pre-wrap; word-break: break-word; }
  .clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .photo { border-radius: 14px; margin-top: 10px; max-height: 360px; width: 100%; object-fit: cover; }

  .rec-box { background: var(--leaf-light); border-radius: 14px; padding: 10px 12px; margin-top: 10px; font-size: .88rem; display: grid; gap: 2px; }
  .rec-box .cond { color: #3d6b3d; }

  .actions { display: flex; gap: 6px; margin-top: 10px; align-items: center; }
  .act { display: flex; align-items: center; gap: 4px; padding: 6px 10px; border-radius: 999px; color: var(--soft); font-size: .88rem; }
  .act:hover { background: #f8eeee; }
  .act.liked { color: var(--tomato); }
  .spacer { flex: 1; }
  .status-pill { font-size: .78rem; padding: 3px 10px; border-radius: 999px; }
  .st-pending { background: #fff4d9; color: #9a6b00; }
  .st-approved { background: var(--leaf-light); color: #2f7d2f; }
  .st-rejected { background: #eee; color: #888; }

  /* ボタン・フォーム */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 20px; border-radius: 999px; background: var(--tomato); color: #fff; font-weight: 700; transition: background .15s; white-space: nowrap; text-decoration: none; }
  .btn:hover { background: var(--tomato-dark); }
  .btn:disabled { background: #d8c9cb; cursor: default; }
  .btn.sub { background: #fff; color: var(--tomato-dark); border: 1.5px solid var(--tomato); }
  .btn.ghost { background: #f4ecec; color: var(--ink); }
  .btn.green { background: var(--leaf); }
  .btn.sm { padding: 6px 14px; font-size: .85rem; }
  .btn.block { width: 100%; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }

  label.f { display: block; font-size: .85rem; font-weight: 700; margin: 14px 0 6px; }
  label.f small { font-weight: 400; color: var(--soft); }
  .input, textarea.input, select.input { width: 100%; border: 1.5px solid var(--line); border-radius: 14px; padding: 11px 14px; background: #fff; outline: none; }
  .input:focus { border-color: var(--pink); }
  textarea.input { min-height: 110px; resize: vertical; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: .88rem; margin-top: 14px; }
  .check input { margin-top: 5px; accent-color: var(--tomato); width: 18px; height: 18px; flex: 0 0 auto; }
  .kind-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kind-pick button { border: 2px solid var(--line); border-radius: 16px; padding: 14px 10px; background: #fff; text-align: center; }
  .kind-pick button.on { border-color: var(--tomato); background: var(--tomato-light); }
  .kind-pick .k-ico { font-size: 1.6rem; display: block; }
  .kind-pick .k-sub { font-size: .75rem; color: var(--soft); }
  .vis { display: grid; gap: 8px; }
  .vis label { display: flex; gap: 10px; align-items: center; border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 14px; background: #fff; cursor: pointer; }
  .vis input { accent-color: var(--tomato); }
  .preview { position: relative; margin-top: 8px; }
  .preview button { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,.55); color: #fff; width: 30px; height: 30px; border-radius: 50%; }
  .hint { font-size: .78rem; color: var(--soft); margin-top: 6px; }

  .sec-title { font-size: .95rem; font-weight: 700; margin: 18px 4px 10px; display: flex; align-items: center; gap: 6px; }

  /* コメント・申請・チャット */
  .cmt { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .cmt:first-child { border-top: none; }
  .cmt .txt { flex: 1; min-width: 0; }
  .cmt .txt b { font-size: .85rem; margin-right: 6px; }
  .mini-link { font-size: .75rem; color: var(--soft); text-decoration: underline; margin-left: 6px; }
  .send-bar { display: flex; gap: 8px; margin-top: 10px; }
  .send-bar .input { border-radius: 999px; }

  .chat { display: flex; flex-direction: column; gap: 10px; padding-bottom: 80px; }
  .bubble-row { display: flex; gap: 8px; align-items: flex-end; }
  .bubble-row.me { flex-direction: row-reverse; }
  .bubble-row > div { max-width: 78%; min-width: 0; }
  .bubble { width: fit-content; padding: 9px 13px; border-radius: 18px; background: #fff; box-shadow: var(--shadow); white-space: pre-wrap; word-break: break-word; }
  .me .bubble { margin-left: auto; background: var(--tomato); color: #fff; }
  .bubble-name { font-size: .72rem; color: var(--soft); margin: 0 0 2px 4px; }
  .chat-bar { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); background: rgba(255,250,247,.96); border-top: 1px solid var(--line); padding: 10px 14px; }
  .chat-bar .inner { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; }

  /* 下のナビ */
  .nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; background: #fff; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .nav .inner { max-width: 560px; margin: 0 auto; display: flex; height: var(--nav-h); align-items: center; }
  .nav a { flex: 1; text-align: center; text-decoration: none; color: var(--soft); font-size: .7rem; line-height: 1.3; }
  .nav a .ni { font-size: 1.35rem; display: block; }
  .nav a.on { color: var(--tomato); font-weight: 700; }
  .nav .plus { width: 52px; height: 52px; border-radius: 50%; background: var(--tomato); color: #fff; display: grid; place-items: center; font-size: 1.8rem; margin: -18px auto 0; box-shadow: 0 6px 16px rgba(226, 87, 76, .4); }

  /* シート・トースト */
  .overlay { position: fixed; inset: 0; background: rgba(40, 20, 25, .4); z-index: 50; display: flex; align-items: flex-end; justify-content: center; animation: fade .15s; }
  .sheet { background: #fff; width: 100%; max-width: 560px; border-radius: 24px 24px 0 0; padding: 20px 18px calc(24px + env(safe-area-inset-bottom)); max-height: 88vh; overflow: auto; animation: up .2s; }
  .sheet h2 { font-size: 1.1rem; margin-bottom: 6px; }
  .sheet .menu-item { display: block; width: 100%; text-align: left; padding: 14px 6px; border-bottom: 1px solid var(--line); font-size: .95rem; }
  .sheet .menu-item.danger { color: var(--tomato-dark); }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  @keyframes fade { from { opacity: 0; } }
  .toast { position: fixed; left: 50%; top: 74px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: .88rem; z-index: 60; max-width: 90vw; animation: up .2s; }

  .empty { text-align: center; color: var(--soft); padding: 40px 16px; }
  .empty .big { font-size: 2.6rem; }
  .loading { text-align: center; padding: 40px; color: var(--soft); }

  /* ログイン */
  .auth { padding: 36px 20px; }
  .auth .hero { text-align: center; margin-bottom: 22px; }
  .auth .hero h1 { font-size: 2.2rem; color: var(--tomato); }
  .auth .hero p { color: var(--soft); }
  .rules { background: var(--pink-light); border-radius: 16px; padding: 12px 16px; font-size: .82rem; margin-top: 16px; }
  .rules li { margin-left: 1.2em; }
  .err { color: var(--tomato-dark); font-size: .85rem; margin-top: 10px; }
</style>
</head>
<body>
  <div id="app"><div class="loading">読み込み中…</div></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
